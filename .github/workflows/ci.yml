name: CI
# Every action is pinned to a full commit SHA; Dependabot keeps the pins and
# their version comments current.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: make fmt-check

  vet:
    name: go vet (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Vet type-checks the test files too, so this also proves the tests
      # compile for every release target.
      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows publishes without symlinks (current.id and copies); the
        # tests that need apt, gpg or createrepo_c skip themselves there.
        # Signing, keygen and xz/zstd decoding are native everywhere.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # With createrepo_c installed, the RPM tests check crossdock's
      # repodata against createrepo_c's own output, field for field.
      - name: Install createrepo_c
        if: runner.os == 'Linux'
        run: pip install --break-system-packages createrepo_c

      # On Linux the apt end-to-end test runs against the runner's real
      # dpkg-deb and apt-get; elsewhere it skips itself.
      - name: Test
        run: go test -race -count=1 -fullpath ./...

  # Real dnf against a signed repo served by `crossdock serve`, on every
  # supported RPM distro: repo_gpgcheck verifies repomd.xml.asc, then dnf
  # lists and downloads the packages; a tampered repomd.xml must be
  # rejected. Fedora runs dnf5 and rpm-sequoia; EL10 runs dnf4 with gpgme.
  dnf:
    name: dnf against crossdock (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:44", "fedora:45", "almalinux:10"]
    container:
      image: ${{ matrix.image }}
    env:
      # The distro Go may be older than go.mod; fetch the toolchain it names.
      GOTOOLCHAIN: auto
    steps:
      - name: Install dependencies
        run: dnf install -y --setopt=install_weak_deps=False git-core golang
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish, serve and use the repo with dnf
        run: |
          # The container runs as root on a checkout it doesn't own; without
          # this, git refuses it and go build fails to stamp VCS info.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go build -o /usr/local/bin/crossdock ./cmd/crossdock
          build-aux/ci/dnf-smoke.sh internal/rpm/testdata

  # The apt end-to-end test on current Debian stable, whose apt verifies
  # with Sequoia's sqv (the Ubuntu runners' apt uses gpgv).
  apt-debian:
    name: apt against crossdock (debian:stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: debian:stable
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git golang-go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test against the real apt
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get --version | head -n 1
          go test -count=1 -v -run 'TestAptEndToEnd' ./cmd/crossdock

  # Real pacman against a signed repo: database and package signatures
  # are checked by pacman's GnuPG, and a tampered database must fail.
  pacman:
    name: pacman against crossdock (Arch Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: archlinux:latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish, serve and use the repo with pacman
        run: |
          # The container runs as root on a checkout it doesn't own; without
          # this, git refuses it and go build fails to stamp VCS info.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go build -o /usr/local/bin/crossdock ./cmd/crossdock
          build-aux/ci/pacman-smoke.sh

  # Builds the .deb, installs it, and runs crossdock the packaged way under
  # the runner's real systemd: path-triggered publishing, the LAN server on
  # :8080, and apt installing and upgrading from it.
  packaging:
    name: Package and system services (deb, systemd)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build the .deb
        run: |
          make cross
          make deb ARCH=amd64 VERSION=v0.0.0-ci
          dpkg-deb --contents dist/crossdock-amd64.deb

      - name: Install it and run the system service smoke test
        run: |
          sudo apt-get install -y ./dist/crossdock-amd64.deb
          sudo build-aux/ci/system-service-smoke.sh
