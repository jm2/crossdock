# crossdock configuration. See README.md for every option.
output: /srv/crossdock/repo
keep_releases: 3

signing:
  key_file: /etc/crossdock/signing.asc   # from `crossdock keygen`
  passphrase_env: CROSSDOCK_PASSPHRASE   # only for a protected key

repos:
  - name: jm2
    format: arch
    source: /srv/crossdock/incoming/arch
    architectures: [x86_64, aarch64]     # "any" packages land in each

  - name: jm2
    format: deb
    source: /srv/crossdock/incoming/deb
    suite: stable
    component: main
    architectures: [amd64, arm64]        # "all" packages land in each
    description: jm2 packages
