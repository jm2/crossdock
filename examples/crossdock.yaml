# crossdock configuration. See README.md for every option.
output: /srv/crossdock/repo
keep_releases: 3

signing:
  key_file: /etc/crossdock/signing.asc   # from `crossdock keygen`
  passphrase_env: CROSSDOCK_PASSPHRASE   # only for a protected key

serve:
  listen: ":8080"
  # index: false                         # no listings or landing page
  public_url: https://repo.example       # for the pages' setup snippets

repos:
  - name: jm2
    format: arch
    source: /srv/crossdock/incoming/arch
    architectures: [x86_64, aarch64]     # "any" packages land in each

  - name: jm2
    format: deb
    source: /srv/crossdock/incoming/deb
    suite: stable
    component: main
    architectures: [amd64, arm64]        # "all" packages land in each
    description: jm2 packages

  - name: jm2
    format: munki                        # macOS disk images + pkginfo sidecars
    source: /srv/crossdock/incoming/munki
    catalog: production                  # for sidecars without catalogs
    site_default: true                   # also manifests/site_default
    # manifests_source: /srv/crossdock/incoming/munki-manifests
